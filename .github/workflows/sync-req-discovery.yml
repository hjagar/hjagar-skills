name: Sync req-discovery mirror

on:
  push:
    branches:
      - main
    paths:
      - 'skills/req-discovery/**'
  workflow_dispatch:

jobs:
  sync:
    name: Sync req-discovery subtree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push subtree to mirror repo
        env:
          TOKEN: ${{ secrets.SYNC_PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git subtree push --prefix=skills/req-discovery "https://x-access-token:${TOKEN}@github.com/hjagar/req-discovery.git" main

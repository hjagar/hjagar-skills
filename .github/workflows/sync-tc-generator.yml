name: Sync tc-generator mirror

on:
  push:
    branches:
      - main
    paths:
      - 'skills/tc-generator/**'
  workflow_dispatch:

jobs:
  sync:
    name: Sync tc-generator subtree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push subtree to mirror repo
        env:
          TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          git remote add mirror "https://x-access-token:${TOKEN}@github.com/hjagar/tc-generator.git"
          git subtree push --prefix=skills/tc-generator mirror main
